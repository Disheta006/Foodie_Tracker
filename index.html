<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main class="app">
        <div class="blob blob-orange"></div>
        <div class="blob blob-yellow"></div>
        <section class="tracker-card">
            <i class="fa-solid fa-pizza-slice logo"></i>
            <h1>Foodie Tracker</h1>
            <p class="subtitle">Track your order from kitchen to doorstep</p>
            <div class="order-details">
                <div class="detail">
                    <span>
                        <span class="icon"><i class="fa-regular fa-user"></i></span>
                        <span class="label">Customer</span>
                    </span>
                    <span class="value">Isheta</span>
                </div>
                <div class="detail">
                    <span>
                        <span class="icon"><i class="fa-regular fa-lemon"></i></span>
                        <span class="label">Food</span>
                    </span>
                    <span class="value">🍕 Margherita Pizza</span>
                </div>
            </div>
            <div id="status-box">
                <span class="status-dot"></span>
                <div>
                    <span class="status-label">Current Status</p>
                    <p id="status-el">Status: </p>
                </div>
            </div>
        <button id="order-btn"><i class="fa-solid fa-bag-shopping"></i> PLACE ORDER</button>
    </main>
</body>
<script src="script.js"></script>
</html>
